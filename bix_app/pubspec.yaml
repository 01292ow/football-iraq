name: bix_app
description: "Bix - تطبيق التواصل الاجتماعي مع الفيديوهات القصيرة والدردشة"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # UI & Animation
  flutter_svg: ^2.0.9
  lottie: ^2.7.0
  animations: ^2.0.8
  flutter_staggered_animations: ^1.1.1
  
  # State Management
  provider: ^6.1.1
  
  # Navigation
  go_router: ^12.1.3
  
  # Video & Media
  video_player: ^2.8.1
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  
  # Authentication
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  google_sign_in: ^6.1.6
  
  # Database & Storage
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  
  # Chat & Messaging
  stream_chat_flutter: ^7.2.0
  
  # Utilities
  shared_preferences: ^2.2.2
  permission_handler: ^11.1.0
  path_provider: ^2.1.1
  uuid: ^4.2.1
  intl: ^0.18.1
  
  # Network
  http: ^1.1.2
  dio: ^5.4.0
  
  # UI Components
  flutter_spinkit: ^5.2.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # Social Features
  share_plus: ^7.2.1
  url_launcher: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
